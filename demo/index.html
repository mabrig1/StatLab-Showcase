<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StatLab frequency demo</title><style>body{font:16px system-ui;background:#111827;color:#eef2ff;max-width:680px;margin:40px auto;padding:20px}label{display:flex;gap:12px;align-items:center;margin:8px}input{width:90px;padding:8px}button{padding:10px;font:inherit}progress{width:45%}pre{white-space:pre-wrap}</style><h1>StatLab — Frequency summary</h1><p>Independent example using synthetic Likert counts scored 1–5. Treats the numeric scores as equally spaced for descriptive calculations.</p><form id="f"><div id="fields"></div><button>Calculate</button></form><pre id="out" aria-live="polite"></pre><div id="bars"></div><script>const fields=document.querySelector('#fields'),out=document.querySelector('#out'),bars=document.querySelector('#bars');[1,2,4,2,1].forEach((v,i)=>{const label=document.createElement('label');label.textContent='Score '+(i+1);const input=document.createElement('input');input.type='number';input.min=0;input.max=1000000;input.step=1;input.required=true;input.value=v;label.append(input);fields.append(label)});document.querySelector('#f').onsubmit=e=>{e.preventDefault();const c=[...fields.querySelectorAll('input')].map(x=>Number(x.value)),n=c.reduce((a,b)=>a+b,0);bars.replaceChildren();if(!n||c.some(x=>!Number.isInteger(x)||x<0)){out.textContent='Enter valid counts with at least one response.';return}const m=c.reduce((a,b,i)=>a+b*(i+1),0)/n,ss=c.reduce((a,b,i)=>a+b*(i+1-m)**2,0);out.textContent='N: '+n+'\nMean: '+m.toFixed(3)+'\nPopulation SD: '+Math.sqrt(ss/n).toFixed(3)+'\nSample SD: '+(n>1?Math.sqrt(ss/(n-1)).toFixed(3):'Undefined');c.forEach((v,i)=>{const row=document.createElement('label'),bar=document.createElement('progress');bar.max=n;bar.value=v;row.textContent=(i+1)+': '+(100*v/n).toFixed(1)+'%';row.append(bar);bars.append(row)})};document.querySelector('#f').requestSubmit();</script></html>
